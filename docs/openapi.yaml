  /api/v1/private/portfolio/{portfolio_id}/commodities/gold/transactions/{transaction_id}:
    get:
      tags:
        - Portfolio Commodities
      summary: Get gold transaction
      description: Requires `portfolio.commodity.read`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PortfolioIDPath"
        - $ref: "#/components/parameters/TransactionIDPath"
      responses:
        "200":
          description: Gold transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldTransactionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags:
        - Portfolio Commodities
      summary: Update gold transaction
      description: Requires `portfolio.commodity.update`. Replays the affected account's transactions chronologically and rejects the update if any sale would exceed the grams then available.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PortfolioIDPath"
        - $ref: "#/components/parameters/TransactionIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoldTransactionRequest"
      responses:
        "200":
          description: Gold transaction updated and holding rebuilt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldTransactionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Portfolio Commodities
      summary: Delete gold transaction
      description: Requires `portfolio.commodity.delete`. Replays remaining transactions and rejects deletion when it would create a historical oversell.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PortfolioIDPath"
        - $ref: "#/components/parameters/TransactionIDPath"
      responses:
        "204":
          description: Gold transaction deleted and holding rebuilt.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
