          type: string
          format: date
          example: 2026-01-15
        maturity_date:
          type: string
          format: date
          example: 2029-01-15
        annual_rate:
          type: number
          format: double
          minimum: 0
          example: 6.25
        coupon_frequency:
          type: string
          enum:
            - monthly
            - quarterly
            - semiannual
            - annual
          example: semiannual
        principal_value:
          type: number
          format: double
          minimum: 0
          example: 10000000
    BondValuationRequest:
      type: object
      required:
        - account_id
      properties:
        account_id:
          type: string
          description: Portfolio account ID for the specific bond holding.
        valuation_date:
          type: string
          format: date
          description: Valuation date. Defaults to current UTC date.
        price:
          type: number
          format: double
          minimum: 0
          description: Market value per 1 principal unit. Either price or market_value is required.
          example: 0.98
        market_value:
          type: number
          format: double
          minimum: 0
          description: Total holding market value. Either price or market_value is required.
          example: 9800000
        notes:
          type: string
          example: Manual readjustment
    BondTransactionRequest:
      type: object
      required:
        - account_id
        - asset_id
      properties:
        account_id:
          type: string
          description: Existing portfolio account ID. Omit only when account_name is provided.
        account_name:
          type: string
          description: Manual bond account name used when account_id is omitted.
          example: Manual Bonds
        asset_id:
          type: string
          description: Existing bond asset ID.
        transaction_type:
          type: string
          default: buy
          enum:
            - buy
            - sell
            - coupon
            - fee
            - tax
            - maturity
        principal_amount:
          type: number
          format: double
          minimum: 0
          description: Required and greater than zero for buy, sell, and maturity.
          example: 10000000
        price:
          type: number
          format: double
          minimum: 0
          description: Price per 1 principal unit. Defaults to 1 when principal_amount is present.
          example: 1
        gross_amount:
          type: number
          format: double
          minimum: 0
          description: Defaults to principal_amount multiplied by price.
          example: 10000000
        cost_amount:
          type: number
          format: double
          minimum: 0
          description: Clean purchase cost / capital basis. Buy defaults to gross amount only. Sell and maturity derive missing cost from current average cost.
          example: 1002000
        accrued_coupon_amount:
          type: number
          format: double
          minimum: 0
          description: Accrued coupon paid on buy or possibly sell transactions. Defaults to 0 and is tracked separately from cost_amount, fee_amount, and tax_amount.
          example: 21412
        fee_amount:
          type: number
          format: double
          minimum: 0
          example: 0
        tax_amount:
          type: number
          format: double
          minimum: 0
          example: 0
        net_amount:
          type: number
          format: double
          minimum: 0
          description: Defaults to gross plus accrued_coupon_amount, fees, and taxes.
          example: 1023412
        transaction_date:
          type: string
          format: date-time
          description: RFC3339 timestamp. Defaults to current UTC time for creates and existing timestamp for updates.
        notes:
          type: string
