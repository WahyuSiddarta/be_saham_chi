    post:
      tags:
        - Portfolio Commodities
      summary: Create gold transaction
      description: Requires `portfolio.commodity.create`. Buys add gross amount, fees, and taxes to cost basis. Sells remove cost using the holding's moving-average IDR cost per gram. A chronologically invalid sale is rejected.
      security:
