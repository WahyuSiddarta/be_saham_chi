        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Portfolio Commodities
      summary: Create or buy gold
      description: Requires `portfolio.commodity.create`. Creates a portfolio gold account and its initial `buy` transaction atomically. When `account_id` is supplied, the buy is added to that existing portfolio account instead. Gold uses an IDR moving-average cost basis.
      security:
        - bearerAuth: []
      parameters:
