        - Master Data
      summary: List master data values
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current USD/IDR and BI rate values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterDataListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/private/admin/master-data/{key}:
    put:
      tags:
        - Master Data
      summary: Update a master data value
      description: Supported keys are `usd_idr_rate` and `bi_rate`. Values must be greater than zero.
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            enum:
              - usd_idr_rate
              - bi_rate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMasterDataRequest"
      responses:
        "200":
          description: Master data value updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterDataUpdateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    StockTickerPath:
      name: ticker
      in: path
      required: true
      schema: {type: string, example: BBCA}
    CommodityPath:
      name: commodity
      in: path
      required: true
      schema:
        type: string
        enum:
          - gold
          - GC=F
          - oil-wti
          - CL=F
          - oil-brent
          - BZ=F
      example: gold
    PortfolioIDPath:
      name: portfolio_id
      in: path
      required: true
      schema:
        type: string
      example: 9f52ca07-4d30-46c8-8c30-62db4f51b820
    AssetIDPath:
      name: asset_id
      in: path
      required: true
      schema:
        type: string
      example: c8e229e5-6fcb-46a7-82d2-9b6dbef9ff9d
    TransactionIDPath:
      name: transaction_id
      in: path
      required: true
      schema:
        type: string
      example: 3b1c8fc7-57c4-4b1c-8425-3b9f1c590a14
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication failed or bearer token is missing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated user is not allowed to access this resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with current resource state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadGateway:
      description: Upstream market data provider failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    StatusOK:
      type: string
      enum:
        - ok
    StatusNOK:
      type: string
      enum:
        - nok
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/StatusOK"
    MasterData:
      type: object
      required:
        - key
        - value
        - updated_at
      properties:
        key:
          type: string
          enum:
            - usd_idr_rate
            - bi_rate
        value:
          type: number
          format: double
        updated_at:
          type: string
          format: date-time
    MasterDataListResponse:
      type: object
      required:
        - status
        - data
      properties:
        status:
          $ref: "#/components/schemas/StatusOK"
        data:
          type: array
          items:
            $ref: "#/components/schemas/MasterData"
    UpdateMasterDataRequest:
      type: object
      required:
        - value
      properties:
        value:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          example: 16250
    MasterDataUpdateResponse:
      allOf:
        - $ref: "#/components/schemas/MasterData"
        - type: object
          required:
            - status
          properties:
            status:
              $ref: "#/components/schemas/StatusOK"
    ErrorResponse:
      type: object
      required:
        - status
        - error
      properties:
        status:
          $ref: "#/components/schemas/StatusNOK"
        error:
          oneOf:
            - type: string
            - type: object
          example: invalid request body
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: secret123
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: secret123
    RegisterResponse:
      type: object
      required:
        - status
        - user
        - portfolio
      properties:
        status:
          $ref: "#/components/schemas/StatusOK"
        user:
          $ref: "#/components/schemas/UserBrief"
        portfolio:
          $ref: "#/components/schemas/PortfolioBrief"
    LoginResponse:
      type: object
      required:
        - status
        - token
        - token_type
        - expires_at
        - user
      properties:
        status:
          $ref: "#/components/schemas/StatusOK"
        token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/UserBrief"
    UserBrief:
      type: object
      required:
        - user_id
        - email
        - role_id
        - status
        - rules
        - created_at
      properties:
        user_id:
          type: string
        email:
          type: string
          format: email
        role_id:
          type: integer
        status:
          type: boolean
        rules:
          type: array
          items:
            type: string
          example:
            - market.gold.read
        created_at:
          type: string
          format: date-time
    PortfolioBrief:
      type: object
      required:
        - portfolio_id
        - name
        - base_currency_code
        - is_main
        - created_at
      properties:
        portfolio_id:
          type: string
        name:
          type: string
          example: Main Portfolio
        base_currency_code:
          type: string
          example: IDR
        is_main:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
    PortfolioRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Growth
    DeletePortfolioRequest:
      type: object
      required:
        - target_portfolio_id
      properties:
        target_portfolio_id:
          type: string
          example: 3b1c8fc7-57c4-4b1c-8425-3b9f1c590a14
    PortfolioResponse:
      type: object
      required:
        - status
        - portfolio_id
        - user_id
        - name
        - base_currency_code
        - is_main
        - created_at
        - updated_at
      properties:
        status:
          $ref: "#/components/schemas/StatusOK"
        portfolio_id:
          type: string
        user_id:
          type: string
        name:
          type: string
          example: Growth
        base_currency_code:
          type: string
          example: IDR
        is_main:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BondRequest:
      allOf:
        - $ref: "#/components/schemas/BondAssetRequest"
        - type: object
          required:
            - symbol
            - name
            - principal_amount
          properties:
            account_id:
              type: string
              description: Existing portfolio account ID. Omit when creating or selecting by account_name.
            account_name:
              type: string
              description: Manual bond account name. Defaults to `Bonds` when account_id is empty.
              example: Manual Bonds
            principal_amount:
              type: number
              format: double
              minimum: 0
              exclusiveMinimum: true
              description: Bond principal or nominal amount currently being bought.
              example: 10000000
            cost_amount:
              type: number
              format: double
              minimum: 0
              description: Capital basis for the buy. Defaults to principal_amount.
              example: 10000000
            accrued_coupon_amount:
              type: number
              format: double
              minimum: 0
              description: Accrued coupon paid with the initial buy. Tracked separately from cost_amount and defaults to 0.
              example: 21412
            fee_amount:
              type: number
              format: double
              minimum: 0
              description: Fee paid with the initial buy. Defaults to 0.
              example: 0
            market_value:
              type: number
              format: double
              minimum: 0
              description: Optional initial manual holding market value.
              example: 9800000
            transaction_date:
              type: string
              format: date-time
              description: RFC3339 timestamp. Defaults to current UTC time.
            notes:
              type: string
    BondAssetRequest:
      type: object
      required:
        - symbol
        - name
      properties:
        symbol:
          type: string
          example: ORI025
        name:
          type: string
          example: ORI025
