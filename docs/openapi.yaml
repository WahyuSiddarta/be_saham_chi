        - transaction_type
        - transaction_date
        - amount
        - cost_amount
        - cash_flow_amount
        - cost_flow_amount
        - pnl_effect_amount
        - currency_code
        - notes
        - created_at
        - updated_at
      properties:
        transaction_id:
          type: string
        portfolio_id:
          type: string
        account_id:
          type: string
        account_name:
          type: string
        asset_id:
          type: string
        transaction_type:
          type: string
          enum:
            - deposit
            - withdrawal
            - interest
            - dividend
            - coupon
            - fee
            - tax
            - maturity
        transaction_date:
          type: string
          format: date-time
        amount:
          type: number
          format: double
          description: Positive stored cash movement amount.
        cost_amount:
          type: number
          format: double
          description: Capital basis applied by this cash transaction. For example, deposit cost normally equals amount while interest/bunga normally has zero cost.
        cash_flow_amount:
          type: number
          format: double
          description: Signed cash balance effect. Deposit, interest, dividend, coupon, and maturity are positive. Withdrawal, fee, and tax are negative.
        cost_flow_amount:
          type: number
          format: double
          description: Signed capital basis effect. No-cost transaction types return 0.
        pnl_effect_amount:
          type: number
          format: double
          description: Signed effect on cash PnL, calculated as cash_flow_amount minus cost_flow_amount.
        currency_code:
          type: string
          example: IDR
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GoldRequest:
      type: object
      required:
        - quantity_grams
        - price
      properties:
        account_id:
          type: string
          format: uuid
          description: Existing portfolio account ID. Omit when creating or selecting by account_name.
        account_name:
          type: string
          description: Gold account name. Defaults to `Gold` when account_id is empty.
          example: Physical Gold
        quantity_grams:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          example: 5
        price:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          description: Executed IDR price per gram.
          example: 1750000
        fee_amount:
          type: number
          format: double
          minimum: 0
          default: 0
        tax_amount:
          type: number
          format: double
          minimum: 0
          default: 0
        transaction_date:
          type: string
          format: date-time
          description: RFC3339 timestamp. Defaults to the current UTC time.
        notes:
          type: string
    GoldTransactionRequest:
      type: object
      required:
        - account_id
        - transaction_type
        - quantity_grams
        - price
      properties:
        account_id:
          type: string
          format: uuid
          description: Existing account owned by the portfolio.
        transaction_type:
          type: string
          enum:
            - buy
            - sell
        quantity_grams:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          example: 5
        price:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          description: Executed IDR price per gram.
          example: 1750000
        fee_amount:
          type: number
          format: double
          minimum: 0
          default: 0
        tax_amount:
          type: number
          format: double
          minimum: 0
          default: 0
        transaction_date:
          type: string
          format: date-time
          description: RFC3339 timestamp. Defaults to the current UTC time on create; an omitted update retains the existing timestamp.
        notes:
          type: string
    GoldHoldingResponse:
      type: object
      required:
        - status
        - data
      properties:
