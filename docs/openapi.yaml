      summary: Create bond transaction
      description: Requires `portfolio.bond.create`. `buy`, `sell`, and `maturity` rebuild the current principal holding, which changes derived coupon display amounts on bond read responses. `coupon` records actual coupon cash received but does not advance or override `next_coupon_date`; expected coupon dates are derived from the bond term calendar. `sell` and `maturity` derive missing cost basis from the current holding average cost.
      security:
