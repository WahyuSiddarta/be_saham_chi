openapi: 3.0.3
info:
  title: be_saham_chi API
  version: 0.1.0
  description: API for stock portfolio tracking, commodity market quotes, and portfolio cash management.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Commodities
  - name: Stocks
  - name: Portfolios
  - name: Cash
  - name: Bond
  - name: Portfolio Commodities
  - name: Master Data
x-tagGroups:
  - name: General
    tags:
      - Health
      - Auth
      - Commodities
      - Stocks
  - name: Portfolio
    tags:
      - Portfolios
      - Cash
      - Bond
      - Portfolio Commodities
  - name: Admin
    tags:
      - Master Data
paths:
  /health:
    get:
      tags:
        - Health
      summary: Check API health
      responses:
        "200":
          description: API is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/public/auth/register:
    post:
      tags:
        - Auth
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered and default portfolio created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/public/auth/login:
    post:
      tags:
        - Auth
      summary: Login and get a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/private/commodities/{commodity}/quote:
    get:
      tags:
        - Commodities
      summary: Get latest commodity quote
      description: Supported commodity values are `gold`, `GC=F`, `oil-wti`, `CL=F`, `oil-brent`, and `BZ=F`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CommodityPath"
      responses:
        "200":
          description: Latest commodity quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/v1/private/stocks/tickers:
    get:
      tags: [Stocks]
      summary: Search active stock tickers
      description: Requires `market.stock.read`. Performs a case-insensitive ticker prefix search. Exact ticker matches are returned first, followed by ticker alphabetically. Only active stocks are included.
      security: [{bearerAuth: []}]
      parameters:
        - name: q
          in: query
          description: Optional ticker prefix. An empty value returns the first active tickers alphabetically.
          schema: {type: string, example: BB}
        - name: limit
          in: query
          description: Maximum number of results. Values above 50 are capped at 50.
          schema: {type: integer, minimum: 1, maximum: 50, default: 10}
      responses:
        "200":
          description: Matching active stock tickers.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StockTickerListResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /api/v1/private/stocks/{ticker}/kline:
    get:
      tags:
        - Stocks
      summary: Get daily stock klines
      description: Reads cached daily Yahoo Finance candles from PostgreSQL. If no rows exist for the requested range, fetches Yahoo, persists the result, and returns the persisted rows. Jakarta tickers are translated to Yahoo's `.JK` symbol form, for example `BBCA` becomes `BBCA.JK`.
      security:
        - bearerAuth: []
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
            example: BBCA
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Daily Yahoo Finance stock kline data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockKlineListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/v1/private/stocks/{ticker}/quote:
    get:
      tags: [Stocks]
      summary: Get a stock quote
      description: Fetches the current quote from Yahoo Finance. Jakarta tickers are translated to Yahoo's `.JK` symbol form.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/StockTickerPath"
      responses:
        "200":
          description: Current Yahoo Finance stock quote.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuoteResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502": {$ref: "#/components/responses/BadGateway"}
  /api/v1/private/stocks/{ticker}/fundamentals:
    get:
      tags: [Stocks]
      summary: Get stored Stockbit fundamentals
      description: Requires `market.stock.read`. Reads the latest Stockbit snapshot written directly to PostgreSQL by the scraper. This API never starts or calls the scraper.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/StockTickerPath"
      responses:
        "200":
          description: Latest stored Stockbit fundamentals snapshot.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StockFundamentalsResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /api/v1/private/admin/stocks:
    get:
      tags: [Stocks]
      summary: List configured stocks
      description: Requires `stock.manage`. Includes active and deactivated stocks used by market-data jobs.
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Configured stocks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockListResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags:
        - Stocks
      summary: Add a configured stock
      description: Requires `stock.manage`. Adds a ticker that can be collected by the Stockbit scraper.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStockRequest"
      responses:
        "201":
          description: Stock created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/private/admin/stocks/{ticker}:
    get:
      tags: [Stocks]
      summary: Get a configured stock
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/StockTickerPath"
      responses:
        "200":
          description: Stock configuration.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StockResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [Stocks]
      summary: Update a stock name
      description: Requires `stock.manage`.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/StockTickerPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateStockRequest"}
      responses:
        "200":
          description: Stock name updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StockResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/private/admin/stocks/{ticker}/status:
    put:
      tags: [Stocks]
      summary: Activate or deactivate a stock
      description: Requires `stock.manage`. Deactivation preserves the stock and market-data history and excludes it from future Stockbit scrape runs.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/StockTickerPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateStockStatusRequest"}
      responses:
        "200":
          description: Stock status updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StockResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/private/commodities/{commodity}/kline:
    get:
      tags:
        - Commodities
      summary: Get daily commodity klines
      description: Supported commodity values are `gold`, `GC=F`, `oil-wti`, `CL=F`, `oil-brent`, and `BZ=F`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CommodityPath"
        - name: range
          in: query
          required: false
          description: Historical range. Supports values like `7d`, `1mo`, `3mo`, `1y`, or `ytd`.
          schema:
            type: string
            default: 1mo
            example: 1mo
      responses:
        "200":
          description: Daily commodity kline data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KlineListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/v1/private/portfolios:
    get:
      tags:
        - Portfolios
      summary: List portfolios
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User portfolios.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Portfolios
      summary: Create portfolio
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioRequest"
      responses:
        "201":
          description: Portfolio created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/private/portfolios/{portfolio_id}:
    get:
      tags:
        - Portfolios
      summary: Get portfolio
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PortfolioIDPath"
      responses:
        "200":
          description: Portfolio detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags:
        - Portfolios
      summary: Update portfolio
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PortfolioIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioRequest"
      responses:
        "200":
          description: Portfolio updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Portfolios
      summary: Delete portfolio and move its data
      description: The main portfolio created during register cannot be deleted. Deleting another portfolio requires `target_portfolio_id`; all accounts, holdings, and transactions are moved to that target portfolio before deletion.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PortfolioIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeletePortfolioRequest"
      responses:
        "204":
          description: Portfolio deleted and data moved.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/private/portfolio/{portfolio_id}/cash:
    get:
      tags:
        - Cash
      summary: Get cash summary
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PortfolioIDPath"
      responses:
        "200":
          description: Portfolio cash summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioCashResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Cash
      summary: Add cash
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PortfolioIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCashRequest"
      responses:
        "201":
          description: Cash added and portfolio cash summary returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioCashResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/private/portfolio/{portfolio_id}/cash/snapshots:
    get:
      tags:
        - Cash
      summary: List cash snapshots
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PortfolioIDPath"
        - name: from
          in: query
          required: false
          description: Start date in `YYYY-MM-DD` format. Defaults to the first day of the current year.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: End date in `YYYY-MM-DD` format. Defaults to today.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Portfolio cash snapshots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashSnapshotListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/private/portfolio/{portfolio_id}/cash/transactions:
    get:
      tags:
        - Cash
      summary: List cash transactions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PortfolioIDPath"
      responses:
        "200":
          description: Portfolio cash transactions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashTransactionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Cash
      summary: Create cash transaction
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PortfolioIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashTransactionRequest"
      responses:
        "201":
          description: Cash transaction created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashTransactionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/private/portfolio/{portfolio_id}/cash/transactions/{transaction_id}:
    get:
      tags:
        - Cash
      summary: Get cash transaction
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PortfolioIDPath"
        - $ref: "#/components/parameters/TransactionIDPath"
      responses:
        "200":
          description: Portfolio cash transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashTransactionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags:
        - Cash
      summary: Update cash transaction
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PortfolioIDPath"
        - $ref: "#/components/parameters/TransactionIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashTransactionRequest"
      responses:
        "200":
          description: Portfolio cash transaction updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashTransactionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Cash
      summary: Delete cash transaction
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PortfolioIDPath"
        - $ref: "#/components/parameters/TransactionIDPath"
      responses:
        "204":
          description: Cash transaction deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/private/portfolio/{portfolio_id}/bonds:
    get:
      tags:
        - Bond
      summary: List bond holdings
      description: Requires `portfolio.bond.read`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PortfolioIDPath"
      responses:
        "200":
          description: Portfolio bond holdings grouped by bond asset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BondListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Bond
      summary: Create or buy a bond
      description: Requires `portfolio.bond.create`. Reuses an existing bond asset with the same symbol, upserts term metadata, creates an initial `buy` transaction, and optionally stores a portfolio-owned manual valuation. This changes the inputs used to derive coupon display fields on bond read responses, including current principal, coupon rate, coupon frequency, issue date, and maturity date.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PortfolioIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BondRequest"
      responses:
        "201":
          description: Bond created or bought.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BondResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/private/portfolio/{portfolio_id}/bonds/snapshots:
    get:
      tags:
        - Bond
      summary: List bond snapshots
      description: Requires `portfolio.bond.read`. Defaults to year-to-date when `from` and `to` are omitted.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PortfolioIDPath"
        - name: from
          in: query
          required: false
          description: Start date in `YYYY-MM-DD` format. Defaults to the first day of the current year.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: End date in `YYYY-MM-DD` format. Defaults to today.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Portfolio bond snapshots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BondSnapshotListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/private/portfolio/{portfolio_id}/bonds/transactions:
    get:
      tags:
        - Bond
      summary: List bond transactions
      description: Requires `portfolio.bond.read`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PortfolioIDPath"
      responses:
        "200":
          description: Portfolio bond transactions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BondTransactionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
