              asset_id: 2ec27c54-09e5-48eb-a54a-3f635fbecf34
              transaction_type: buy
              principal_amount: 1000000
              price: 1.002
              gross_amount: 1002000
              cost_amount: 1002000
              accrued_coupon_amount: 21412
              fee_amount: 0
              tax_amount: 0
              net_amount: 1023412
      responses:
        "201":
