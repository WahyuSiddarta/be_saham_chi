        - asset_id
        - transaction_type
        - transaction_date
        - quantity_grams
        - price
        - gross_amount
        - cost_amount
        - fee_amount
        - tax_amount
        - net_amount
        - realized_pnl
        - currency_code
        - notes
        - created_at
        - updated_at
      properties:
        transaction_id:
          type: string
          format: uuid
        portfolio_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        account_name:
          type: string
        asset_id:
          type: string
          format: uuid
        transaction_type:
          type: string
          enum:
            - buy
            - sell
        transaction_date:
          type: string
          format: date-time
        quantity_grams:
          type: number
          format: double
        price:
          type: number
          format: double
          description: Executed IDR price per gram.
        gross_amount:
          type: number
          format: double
          description: Quantity multiplied by executed price.
        cost_amount:
          type: number
          format: double
          description: Buy cost including fees and taxes, or moving-average cost removed by a sell.
        fee_amount:
          type: number
          format: double
        tax_amount:
          type: number
          format: double
        net_amount:
          type: number
          format: double
          description: Buy gross plus fees and taxes, or sell gross minus fees and taxes.
        realized_pnl:
          type: number
          format: double
          description: Sell net proceeds minus removed moving-average cost; zero for buys.
        currency_code:
          type: string
